# Builds Shalaghi installers: .exe (NSIS) on Windows, .deb on Ubuntu.
# .deb cannot be cross-built on Windows — it is produced here on ubuntu-latest.
# Run: push a tag like v0.1.0, or manual dispatch from the Actions tab.

name: build-installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    # The tauri-action step creates/updates the draft GitHub Release, which
    # needs write access: without this the job fails at the very end with
    # "Resource not accessible by integration" (default token is read-only).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Shalaghi ${{ github.ref_name }}"
          releaseDraft: true
          # tauri-action has no `bundle` input (it warns "Unexpected input");
          # CLI flags go through `args` instead.
          args: --bundles ${{ matrix.bundles }}
